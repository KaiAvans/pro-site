<head>
    <link rel="stylesheet" href="fonts.css" />
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <div class="header">
        <div class="top-header">
            <div class="top-header__perks">
                <p><strong>Gratis</strong> verzending vanaf 25,-</p>
                <p>Bezorging dezelfde dag, 's avonds of in het weekend*</p>
                <p><strong>Gratis</strong> retourneren</p>
            </div>
            <div class="top-header__select-badge">
                <div class="select-button">
                    <p>Select.</p>
                </div>
                <p>Ontdek nu de 4 voordelen</p>
            </div>
        </div>
        <div class="main-header-background">
            <div class="main-header">
                <img class="main-header__logo" src="assets/images/logo.webp" />

                <div class="search-section">
                    <div class="searchbar">
                        <input
                            type="text"
                            class="searchbar__input"
                            placeholder="Waar ben je naar op zoek?"
                        />
                        <img
                            class="searchbar__icon"
                            src="assets/icons/search.svg"
                        />
                    </div>
                    <button class="searchbar__sparkle-button">
                        <img src="assets/icons/sparkle.svg" />Shophulp
                    </button>
                </div>

                <div class="account-section">
                    <a class="account-section__login">Inloggen</a>
                    <img
                        class="account-section__button"
                        src="assets/icons/heart.svg"
                    />
                    <img
                        class="account-section__button"
                        src="assets/icons/shopping.svg"
                    />
                </div>
            </div>
        </div>
        <div class="navbar">
            <ul class="navbar__list navbar__list--primary">
                <li>Categorieën</li>
                <li>Cadeaus & Inspiratie</li>
                <li>Aanbiedingen</li>
            </ul>
            <ul class="navbar__list navbar__list--secondary">
                <li>Zakelijk</li>
                <li>Cadeaukaart</li>
                <li>Bestelstatus</li>
                <li>Klantenservice</li>
                <li>
                    <img src="assets/icons/nl.svg" />NL<img
                        src="assets/icons/arrow_down.svg"
                    />
                </li>
            </ul>
        </div>
    </div>
</body>
